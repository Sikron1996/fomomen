<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOMO MEN</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <nav class="nav">
    <div class="navLogo">🔥 FOMO MEN</div>
    <a href="#mint">Mint</a>
    <a href="#preview">Preview</a>
    <a id="openseaLink" target="_blank">OpenSea</a>
    <a id="etherscanLink" target="_blank">Etherscan</a>
    <button id="connectBtn">Connect</button>
  </nav>

  <section class="hero">
    <img class="float f1" src="assets/fomo1.jpg">
    <img class="float f2" src="assets/fomo2.jpg">
    <img class="float f3" src="assets/fomo3.jpg">
    <img class="float f4" src="assets/fomo4.jpg">
    <img class="float f5" src="assets/fomo5.jpg">
    <img class="float f6" src="assets/fomo6.jpg">

    <h1>FOMO<br>MEN</h1>

    <section id="mint" class="mintBox">
      <button id="mintBtn" class="mintBig">MINT FOMO MEN</button>

      <div class="supply">
        <span id="mintedText">0</span> of <b>10,000</b> minted
      </div>
      <div class="sub">
        1 FREE mint per wallet · next mints 0.0001 ETH
      </div>

      <div class="amount">
        <button id="minus">-</button>
        <input id="amount" value="1">
        <button id="plus">+</button>
      </div>

      <div class="total">TOTAL: <b id="totalPrice">FREE</b></div>
      <div id="wallet" class="wallet">not connected</div>
      <p id="status"></p>
    </section>
  </section>

  <section class="info">
    <div><b>10,000</b><span>Supply</span></div>
    <div><b>FREE</b><span>First mint</span></div>
    <div><b>0.0001Ξ</b><span>Next mints</span></div>
    <div><b>BLACKLIST</b><span>Bot protection</span></div>
  </section>

  <section id="preview" class="preview">
    <h2>Preview FOMO MEN</h2>
    <div class="grid">
      <img src="assets/fomo1.jpg">
      <img src="assets/fomo2.jpg">
      <img src="assets/fomo3.jpg">
      <img src="assets/fomo4.jpg">
      <img src="assets/fomo5.jpg">
      <img src="assets/fomo6.jpg">
    </div>
  </section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
